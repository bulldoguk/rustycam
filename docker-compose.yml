services:
  rustycam:
    build: .
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - /mnt/cameras:/data          # adjust to your storage mount
    environment:
      RUST_LOG: rustycam=info
    network_mode: host              # simplest for reaching camera IPs directly
