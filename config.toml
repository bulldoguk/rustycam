[server]
port = 8090
bind = "0.0.0.0"

[storage]
base_path = "/data"
ring_buffer_dir = "/tmp/rustycam_ring"
ring_segment_seconds = 5
ring_segments_kept = 12   # 60s ring buffer
pre_event_seconds = 30
post_event_seconds = 15
idle_debounce_seconds = 30
max_session_seconds = 60

[database]
path = "/data/rustycam.db"

[[cameras]]
id = "front_door"
name = "Front Door"
ip = "192.168.1.101"
username = "admin"
password = "changeme"
rtsp_stream = "sub"   # sub uses less CPU; use "main" for full res
zone = "front_porch"

[[cameras]]
id = "backyard_east_duo3"
name = "Backyard East"
ip = "192.168.1.102"
username = "admin"
password = "changeme"
rtsp_stream = "sub"
zone = "backyard"

[[cameras]]
id = "cam_front_door_west"
name = "Front Door West"
ip = "192.168.20.10"
username = "admin"
password = "changeme"
rtsp_stream = "sub"
