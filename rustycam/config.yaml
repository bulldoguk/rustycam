name: RustyCam NVR
version: "0.1.24"
slug: rustycam
description: RTSP camera capture and NVR — stores footage to your NAS
url: https://github.com/bulldoguk/rustycam
image: ghcr.io/bulldoguk/rustycam
arch:
  - aarch64
  - amd64

startup: application
boot: auto

ports:
  8090/tcp: 8090
webui: "http://[HOST]:[PORT:8090]/"

map:
  - share:rw
  - media:rw

options:
  storage_path: /share/rustycam
  pre_event_seconds: 15
  post_event_seconds: 15
  idle_debounce_seconds: 30
  max_session_seconds: 60
  cameras: []

schema:
  storage_path: str
  pre_event_seconds: int(1,300)
  post_event_seconds: int(1,300)
  idle_debounce_seconds: int(1,600)
  max_session_seconds: int(1,3600)
  cameras:
    - id: str
      name: str
      ip: str
      username: str
      password: password
      rtsp_stream: list(sub|main)
      zone: str?
      excluded_topics: str?
