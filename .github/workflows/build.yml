name: Build and push Docker image

on:
  push:
    branches: [main]
    paths:
      - 'rustycam/**'

jobs:
  check:
    # fmt, clippy and tests (ci.yml), the same job PRs must pass
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Get version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' rustycam/config.yaml | sed 's/version: *//' | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: rustycam
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/bulldoguk/rustycam:${{ steps.version.outputs.version }}
            ghcr.io/bulldoguk/rustycam:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
