name: Build and push Docker image

on:
  push:
    branches: [main]
    paths:
      - 'rustycam/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustycam

      - name: Run tests
        working-directory: rustycam
        run: cargo test --release

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Get version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' rustycam/config.yaml | sed 's/version: *//' | tr -d '"')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: rustycam
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/bulldoguk/rustycam:${{ steps.version.outputs.version }}
            ghcr.io/bulldoguk/rustycam:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
