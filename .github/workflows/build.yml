name: Build and push Docker image

on:
  push:
    branches: [main]
    paths:
      - 'rustycam/**'

jobs:
  check:
    # fmt, clippy and tests (ci.yml), the same job PRs must pass
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' rustycam/config.yaml | sed 's/version: *//' | tr -d '"')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: rustycam
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/bulldoguk/rustycam:${{ steps.version.outputs.version }}
            ghcr.io/bulldoguk/rustycam:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
