name: CI

# The required check for PRs (ruleset on main). No paths filter: a required check that
# doesn't run on a PR never reports, and the ruleset would block it.
# build.yml also calls this before building the image.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dockerfile and rust-toolchain.toml agree on the Rust version
        run: bash .github/check-rust-version.sh

      - name: Install Rust (the version in rust-toolchain.toml)
        working-directory: rustycam
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rustycam

      - name: Format
        working-directory: rustycam
        run: cargo fmt --check

      - name: Clippy
        working-directory: rustycam
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: rustycam
        run: cargo test --release
