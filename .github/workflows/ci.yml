name: CI

# The required check for PRs (ruleset on main). No paths filter: a required check that
# doesn't run on a PR never reports, and the ruleset would block it.
# build.yml also calls this before building the image.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rustycam

      - name: Format
        working-directory: rustycam
        run: cargo fmt --check

      - name: Clippy
        working-directory: rustycam
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: rustycam
        run: cargo test --release
