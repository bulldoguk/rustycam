version: 2
updates:
  - package-ecosystem: cargo
    directory: /rustycam
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # Base images (rust builder, alpine runtime). A rust bump stays red in CI
  # until rust-toolchain.toml is bumped to match.
  - package-ecosystem: docker
    directory: /rustycam
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
